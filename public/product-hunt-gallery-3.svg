<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1270 760" width="1270" height="760">
  <defs>
    <linearGradient id="g3-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181825"/>
      <stop offset="100%" stop-color="#11111b"/>
    </linearGradient>
    <filter id="shadow3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1270" height="760" fill="url(#g3-bg)"/>

  <!-- Header -->
  <text x="635" y="85" fill="#cdd6f4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="38" font-weight="800" text-anchor="middle">Built for Developers &amp; Autonomous Agents</text>
  <text x="635" y="125" fill="#a6adc8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" text-anchor="middle">Seamlessly integrate into Python scripts, automation pipelines, and CI jobs.</text>

  <!-- Left: CLI & Code Card -->
  <g transform="translate(100, 180)" filter="url(#shadow3)">
    <rect width="520" height="490" rx="16" fill="#11111b" stroke="#313244" stroke-width="1.5"/>
    <circle cx="30" cy="25" r="5" fill="#f38ba8"/>
    <circle cx="48" cy="25" r="5" fill="#fab387"/>
    <circle cx="66" cy="25" r="5" fill="#a6e3a1"/>
    <text x="260" y="29" fill="#a6adc8" font-family="monospace" font-size="12" text-anchor="middle">agent_runner.py</text>

    <!-- Code text -->
    <g transform="translate(30, 70)" font-family="monospace" font-size="13">
      <text y="0" fill="#a6adc8"># 1-line installation</text>
      <text y="25" fill="#a6e3a1">$ pip install dontlockpc</text>
      
      <text y="75" fill="#89b4fa">from</text>
      <text x="45" y="75" fill="#cdd6f4">dontlockpc.backends</text>
      <text x="220" y="75" fill="#89b4fa">import</text>
      <text x="280" y="75" fill="#fab387">get_backend</text>

      <text y="115" fill="#cdd6f4">backend = get_backend()</text>
      <text y="140" fill="#a6e3a1">backend.prevent_sleep()</text>

      <text y="185" fill="#89b4fa">try:</text>
      <text x="20" y="210" fill="#a6adc8"># Long running autonomous agent job</text>
      <text x="20" y="235" fill="#cdd6f4">run_claude_computer_use_agent()</text>
      <text x="20" y="260" fill="#cdd6f4">run_data_pipeline_migration()</text>

      <text y="305" fill="#89b4fa">finally:</text>
      <text x="20" y="330" fill="#f38ba8">backend.allow_sleep()</text>
      <text x="20" y="355" fill="#cdd6f4">backend.close()</text>
    </g>

    <!-- Bottom note -->
    <rect x="25" y="420" width="470" height="42" rx="8" fill="#181825" stroke="#313244"/>
    <text x="40" y="446" fill="#94e2d5" font-family="sans-serif" font-size="12">✓ Invisible ±1px nudge + F15 key (never steals window focus)</text>
  </g>

  <!-- Right: Use Cases Card -->
  <g transform="translate(660, 180)" filter="url(#shadow3)">
    <rect width="510" height="490" rx="16" fill="#181825" stroke="#313244" stroke-width="1.5"/>
    <text x="35" y="45" fill="#cdd6f4" font-family="sans-serif" font-size="20" font-weight="700">Perfect For Today's Workflows</text>

    <!-- Item 1 -->
    <g transform="translate(35, 75)">
      <circle cx="18" cy="18" r="18" fill="#1e1e2e"/>
      <text x="18" y="24" font-size="16" text-anchor="middle">🤖</text>
      <text x="50" y="16" fill="#cdd6f4" font-family="sans-serif" font-size="15" font-weight="600">Autonomous AI Agents</text>
      <text x="50" y="38" fill="#a6adc8" font-family="sans-serif" font-size="13">Claude Computer Use, AutoGPT, Agentic coders running overnight.</text>
    </g>

    <!-- Item 2 -->
    <g transform="translate(35, 155)">
      <circle cx="18" cy="18" r="18" fill="#1e1e2e"/>
      <text x="18" y="24" font-size="16" text-anchor="middle">📦</text>
      <text x="50" y="16" fill="#cdd6f4" font-family="sans-serif" font-size="15" font-weight="600">Large Model Weights &amp; Builds</text>
      <text x="50" y="38" fill="#a6adc8" font-family="sans-serif" font-size="13">Downloading 40GB LLMs, Docker builds, PyTorch fine-tuning jobs.</text>
    </g>

    <!-- Item 3 -->
    <g transform="translate(35, 235)">
      <circle cx="18" cy="18" r="18" fill="#1e1e2e"/>
      <text x="18" y="24" font-size="16" text-anchor="middle">🏢</text>
      <text x="50" y="16" fill="#cdd6f4" font-family="sans-serif" font-size="15" font-weight="600">Strict Corporate Lock Policies</text>
      <text x="50" y="38" fill="#a6adc8" font-family="sans-serif" font-size="13">Prevent 5-minute screen timeout locks during live presentations or RDP.</text>
    </g>

    <!-- Item 4 -->
    <g transform="translate(35, 315)">
      <circle cx="18" cy="18" r="18" fill="#1e1e2e"/>
      <text x="18" y="24" font-size="16" text-anchor="middle">🌐</text>
      <text x="50" y="16" fill="#cdd6f4" font-family="sans-serif" font-size="15" font-weight="600">Zero-Install Instant Web Tab</text>
      <text x="50" y="38" fill="#a6adc8" font-family="sans-serif" font-size="13">Keep browser active immediately using Screen Wake Lock API.</text>
    </g>

    <g transform="translate(35, 410)">
      <rect width="440" height="48" rx="8" fill="#11111b" stroke="#a6e3a1" stroke-width="1"/>
      <text x="20" y="30" fill="#a6e3a1" font-family="sans-serif" font-size="13" font-weight="600">⭐ 100% Free &amp; Open Source (MIT License)</text>
    </g>
  </g>
</svg>

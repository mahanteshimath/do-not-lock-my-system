<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181825"/>
      <stop offset="100%" stop-color="#11111b"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a6e3a1"/>
      <stop offset="100%" stop-color="#94e2d5"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#94e2d5" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="240" height="240" rx="48" fill="url(#bg)"/>
  <rect x="2" y="2" width="236" height="236" rx="46" fill="none" stroke="#313244" stroke-width="2"/>

  <!-- Subtle pulse ring -->
  <circle cx="120" cy="115" r="70" fill="none" stroke="#a6e3a1" stroke-width="1.5" stroke-opacity="0.25" stroke-dasharray="4 4"/>

  <!-- Center Lightning Emblem -->
  <g filter="url(#glow)">
    <path d="M135 38 L72 124 H120 L105 202 L172 108 H126 Z" fill="url(#bolt)"/>
  </g>

  <!-- Status indicator dot -->
  <circle cx="178" cy="62" r="7" fill="#a6e3a1"/>
  <circle cx="178" cy="62" r="12" fill="none" stroke="#a6e3a1" stroke-width="1.5" stroke-opacity="0.5"/>
</svg>

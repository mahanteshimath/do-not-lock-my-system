<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1270 760" width="1270" height="760">
  <defs>
    <linearGradient id="g1-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181825"/>
      <stop offset="50%" stop-color="#11111b"/>
      <stop offset="100%" stop-color="#0e0e16"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a6e3a1"/>
      <stop offset="100%" stop-color="#94e2d5"/>
    </linearGradient>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1270" height="760" fill="url(#g1-bg)"/>
  <circle cx="1100" cy="150" r="300" fill="#94e2d5" opacity="0.04"/>
  <circle cx="150" cy="650" r="250" fill="#a6e3a1" opacity="0.03"/>

  <!-- Top Badge -->
  <rect x="80" y="70" width="220" height="32" rx="16" fill="#1e1e2e" stroke="#313244" stroke-width="1"/>
  <text x="190" y="91" fill="#94e2d5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="600" text-anchor="middle">⚡ OPEN SOURCE UTILITY</text>

  <!-- Headline -->
  <text x="80" y="155" fill="#cdd6f4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">Don't Lock My PC</text>
  <text x="80" y="200" fill="#a6adc8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="400">Keep your computer awake and unlocked while AI agents do the work.</text>

  <!-- Feature Pills -->
  <g transform="translate(80, 240)">
    <rect x="0" y="0" width="230" height="42" rx="8" fill="#181825" stroke="#313244"/>
    <circle cx="20" cy="21" r="5" fill="#a6e3a1"/>
    <text x="35" y="26" fill="#cdd6f4" font-family="sans-serif" font-size="14" font-weight="500">Zero corporate lock interruptions</text>

    <rect x="245" y="0" width="180" height="42" rx="8" fill="#181825" stroke="#313244"/>
    <circle cx="265" cy="21" r="5" fill="#94e2d5"/>
    <text x="280" y="26" fill="#cdd6f4" font-family="sans-serif" font-size="14" font-weight="500">No registry hacks</text>

    <rect x="440" y="0" width="190" height="42" rx="8" fill="#181825" stroke="#313244"/>
    <circle cx="460" cy="21" r="5" fill="#fab387"/>
    <text x="475" y="26" fill="#cdd6f4" font-family="sans-serif" font-size="14" font-weight="500">Scheduled auto-sleep</text>
  </g>

  <!-- Main App Mockup Card -->
  <g transform="translate(420, 320)" filter="url(#card-shadow)">
    <!-- App Window Frame -->
    <rect width="430" height="380" rx="16" fill="#11111b" stroke="#313244" stroke-width="1.5"/>
    
    <!-- Window controls -->
    <circle cx="28" cy="26" r="6" fill="#f38ba8"/>
    <circle cx="48" cy="26" r="6" fill="#fab387"/>
    <circle cx="68" cy="26" r="6" fill="#a6e3a1"/>

    <!-- App Title -->
    <text x="215" y="65" fill="#cdd6f4" font-family="sans-serif" font-size="18" font-weight="700" text-anchor="middle">⚡ Keep Awake</text>
    <text x="215" y="86" fill="#585b70" font-family="sans-serif" font-size="11" text-anchor="middle">Keeps AI agents running — no lock, sleep or display-off</text>

    <!-- Status Box -->
    <rect x="40" y="105" width="350" height="85" rx="12" fill="#181825" stroke="#a6e3a1" stroke-width="1.5"/>
    <circle cx="165" cy="135" r="6" fill="#a6e3a1"/>
    <text x="180" y="140" fill="#a6e3a1" font-family="sans-serif" font-size="15" font-weight="700" letter-spacing="1">ACTIVE</text>
    <text x="215" y="168" fill="#a6adc8" font-family="monospace" font-size="12" text-anchor="middle">Signals: 142  •  Last: 18:24:05</text>

    <!-- Interval row -->
    <text x="180" y="218" fill="#a6adc8" font-family="sans-serif" font-size="12" text-anchor="middle">Interval: [ 30 ] sec</text>

    <!-- Buttons -->
    <rect x="40" y="240" width="165" height="42" rx="8" fill="#181825" stroke="#313244"/>
    <text x="122" y="266" fill="#585b70" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">▶ START</text>

    <rect x="225" y="240" width="165" height="42" rx="8" fill="#f38ba8"/>
    <text x="307" y="266" fill="#11111b" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">⏹ STOP</text>

    <!-- Options snippet -->
    <text x="215" y="315" fill="#a6adc8" font-family="sans-serif" font-size="11" text-anchor="middle">Then Shutdown after 120 min</text>
    <text x="215" y="340" fill="#94e2d5" font-family="sans-serif" font-size="11" text-anchor="middle">✓ Stay awake even with lid closed</text>
  </g>

  <!-- Side Callout 1 -->
  <g transform="translate(80, 410)">
    <rect width="280" height="90" rx="12" fill="#181825" stroke="#313244"/>
    <text x="20" y="35" fill="#94e2d5" font-family="sans-serif" font-size="14" font-weight="700">Web Screen Wake Lock</text>
    <text x="20" y="60" fill="#a6adc8" font-family="sans-serif" font-size="12">Run in browser instantly with 0 installs</text>
    <text x="20" y="76" fill="#585b70" font-family="sans-serif" font-size="11">Perfect for quick Claude or Cursor jobs</text>
  </g>

  <!-- Side Callout 2 -->
  <g transform="translate(910, 410)">
    <rect width="280" height="90" rx="12" fill="#181825" stroke="#313244"/>
    <text x="20" y="35" fill="#fab387" font-family="sans-serif" font-size="14" font-weight="700">Native Windows &amp; macOS</text>
    <text x="20" y="60" fill="#a6adc8" font-family="sans-serif" font-size="12">System tray, autostart, &amp; lid-close</text>
    <text x="20" y="76" fill="#585b70" font-family="sans-serif" font-size="11">Python CLI: pip install dontlockpc</text>
  </g>
</svg>

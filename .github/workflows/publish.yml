name: Publish to PyPI

# Publishes the package to PyPI when a GitHub Release is published.
#
# ONE-TIME SETUP (required before this succeeds): configure a PyPI Trusted
# Publisher for this repo — on the PyPI project page go to
# Publishing → Add a new publisher (GitHub Actions):
#   owner:       mahanteshimath
#   repository:  do-not-lock-my-system
#   workflow:    publish.yml
#   environment: pypi
# Docs: https://docs.pypi.org/trusted-publishers/
#
# Until that is configured this workflow will fail; it does NOT affect the
# binary Release build (release.yml). You can also run it manually from the
# Actions tab (workflow_dispatch).

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI trusted publishing (OIDC) — no API token needed
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
